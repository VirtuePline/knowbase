<!doctype html><html lang="zh-CN"><meta charset="utf-8"><link rel="stylesheet" href="file:///F:/claude/ag/web/styles.css"><link rel="stylesheet" href="file:///F:/claude/ag/web/theme.css"><body><main style="margin:0;padding:24px"><div class="panel-card">      <h2 id="editor-title">新建工作记录</h2>
      <div class="editor-bar">
        <input type="text" id="md-name" placeholder="记录名称（留空自动命名，默认保存为 md 文件）" />
        <span class="multicat category-tags" id="md-cat-multi">
          <button type="button" class="cat-select multicat-btn" id="md-cat-btn" title="选择分类；未选择时按内容自动判断">选择分类</button>
          <span id="md-subcats" class="category-tag-list"></span>
        </span>
        <input type="date" id="md-time" title="记录时间：默认当前日期，只需选择年月日" />
        <select id="md-resolved" title="完成情况：时间线徽标按此显示；时间线上的人工标记优先于这里的选择">
          <option value="unresolved">未完成</option>
          <option value="improving">处理中</option>
          <option value="temporary">阶段完成</option>
          <option value="resolved">已完成</option>
        </select>
        <div class="md-mode" role="group" aria-label="编辑模式">
          <button type="button" class="md-mode-btn active" data-mode="preview" title="在渲染结果上直接书写">预览</button>
          <button type="button" class="md-mode-btn" data-mode="source" title="编辑 Markdown 原文">源码</button>
        </div>
        <button class="ghost" id="md-save">保存并入知识库</button>
        <span class="muted" id="md-status"></span>
      </div>
</div></main><script>function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function escapeAttr(s) {
  return String(s).replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function createCategoryPicker({ btn, sub, emptyLabel = "自动判定", tags = false, onChange } = {}) {
  const uid = ++pickerSeq;
  const state = new Set();     // 已勾选的记录分类（空 = 自动判定）
  const subState = new Map();  // 类型 → 已选的二级选项值

  function labelText() {
    if (!state.size) return emptyLabel;
    const names = [...state];
    return names.length === 1 ? names[0] : `${names[0]} 等 ${names.length} 项`;
  }
  function renderSubs() {
    btn.hidden = tags && state.size > 0;
    if (tags) {
      const chips = [...state].map((cat) => {
        const leaf = subState.get(cat) || cat;
        const path = leaf === cat ? cat : `${cat} / ${leaf}`;
        return `<span class="category-token" title="${escapeAttr(path)}"><span>${escapeHtml(leaf)}</span><button type="button" class="category-token-remove" data-remove-category="${escapeAttr(cat)}" aria-label="${escapeAttr(`删除分类：${path}`)}" title="删除分类">×</button></span>`;
      });
      if (state.size) chips.push('<button type="button" class="category-tag-add" data-add-category aria-label="添加分类" title="添加分类">+</button>');
      sub.innerHTML = chips.join("");
      return;
    }
    const parts = [];
    for (const cat of state) {
      const conf = CATEGORY_SUBS[cat];
      if (!conf) continue;
      const current = subState.get(cat) || "";
      parts.push(`<span class="subcat"><span class="subcat-label">${escapeHtml(conf.label)}：</span>${
        (conf.getOptions() || []).map((name) =>
          `<label class="subcat-opt"><input type="radio" name="picker-${uid}-sub" data-subcat="${escapeAttr(cat)}" value="${escapeAttr(name)}"${name === current ? " checked" : ""}>${escapeHtml(name)}</label>`).join("")}</span>`);
    }
    sub.innerHTML = parts.join(" ");   // 容器固定占位，无二级选项时留白，后面控件不移动
  }
  function prune() {
    for (const key of [...subState.keys()]) if (!state.has(key)) subState.delete(key);
  }
  function sync() {
    btn.textContent = labelText();
    renderSubs();
    if (onChange) onChange();
  }

  function openDialog(e) {
    e.stopPropagation();
    catDialog.open({
      selected: [...state].filter(Boolean),
      subs: Object.fromEntries(subState),
      allowAuto: true,
      onConfirm: (cats, subs) => {
        state.clear();
        for (const c of cats) if (selectableCategories().includes(c)) state.add(c);
        subState.clear();
        for (const [k, v] of Object.entries(subs || {})) if (v) subState.set(k, v);
        prune();
        sync();
      },
    });
  }
  btn.addEventListener("click", openDialog);
  if (tags) sub.addEventListener("click", (e) => {
    const remove = e.target.closest("[data-remove-category]");
    if (remove) {
      state.delete(remove.dataset.removeCategory);
      prune();
      sync();
      (sub.querySelector("[data-add-category]") || btn).focus();
    } else if (e.target.closest("[data-add-category]")) {
      openDialog(e);
    }
  });
  sub.addEventListener("change", (e) => {
    const radio = e.target.closest("input[type=radio]");
    if (!radio) return;
    subState.set(radio.dataset.subcat, radio.value);
    if (onChange) onChange();
  });

  return {
    selected: () => [...state].filter(Boolean),
    isEmpty: () => !state.size,
    has: (cat) => state.has(cat),
    subValue: (cat) => subState.get(cat) || "",
    setSub(cat, value) { if (state.has(cat)) { subState.set(cat, value || ""); renderSubs(); } },
    set(cats) {   // 统一入口：设置选中的记录分类（同步按钮文字与二级选项区）
      state.clear();
      for (const c of cats || []) if (selectableCategories().includes(c)) state.add(c);
      prune();
      sync();
    },
    refresh: renderSubs,   // 厂商清单变化后重渲染二级选项
  };
}
let pickerSeq=0;const CATEGORY_SUBS={};function selectableCategories(){return ["厂商系统","网络问题"];};const catDialog={open(){}};
const p=createCategoryPicker({btn:document.querySelector("#md-cat-btn"),sub:document.querySelector("#md-subcats"),emptyLabel:"选择分类",tags:true});
p.set(["厂商系统","网络问题"]);p.setSub("厂商系统","示例厂商");
</script></body></html>
