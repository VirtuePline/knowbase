<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#102f2e" />
<title>修改密码 · 企业知识库</title>
<link rel="stylesheet" href="/static/accounts.css" />
<script src="/static/accounts.js" defer></script>
</head>
<body data-account-page="change-password">
<main class="account-layout">
  <section class="account-story" aria-label="企业知识库">
    <div class="account-brand"><span class="account-brand-icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M7 7h7a4 4 0 014 4v15a7 7 0 00-7-3H7V7Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M25 7h-3a4 4 0 00-4 4v15a7 7 0 017-3V7Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M11 12h3m-3 5h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span><div><strong>企业知识库</strong><span>公共知识 · 部门协作</span></div></div>
    <div class="story-content"><span class="story-eyebrow">安心开展每一天的工作</span><h1>为工作账号，<br />设一道可靠的保护。</h1><p>管理您自己的登录密码，<br />继续探索团队积累的知识。</p>
      <div class="story-workflow"><div><span>01</span><strong>汇集知识</strong><small>保存制度、资料与工作经验</small></div><div><span>02</span><strong>部门协作</strong><small>按所属部门与共享范围授权</small></div><div><span>03</span><strong>可靠问答</strong><small>从有权访问的文档中查找答案</small></div></div>
    </div>
    <span class="story-footer">ENTERPRISE KNOWLEDGE · SHARED WORKSPACE</span>
  </section>
  <section class="account-form-region" aria-labelledby="account-title">
    <div class="account-form-wrap">
      <a class="account-back" id="password-back" href="/" hidden>← 返回企业知识工作台</a>
      <div class="account-heading"><span class="account-section-label" id="password-section-label">账号设置</span><h2 id="account-title">修改密码</h2><p id="password-description">设置新的登录密码，继续使用企业知识工作台。</p></div>
      <div class="register-context">当前账号 <strong id="password-user">正在确认账号…</strong><span id="password-context-note">密码仅用于您自己的账号</span></div>
      
      <form id="account-form" novalidate>
        <fieldset id="account-fields" disabled>
          <label class="account-field" id="current-password-row" hidden><span>当前密码</span><div class="password-shell"><input id="account-current-password" type="password" name="current_password" autocomplete="current-password" placeholder="输入当前密码" maxlength="128" disabled /><button data-password-target="account-current-password" type="button" aria-label="显示当前密码" aria-pressed="false">显示</button></div></label>
          <label class="account-field"><span>新密码</span><div class="password-shell"><input id="account-new-password" type="password" name="new_password" autocomplete="new-password" placeholder="设置 8–128 位新密码" minlength="8" maxlength="128" required /><button data-password-target="account-new-password" type="button" aria-label="显示新密码" aria-pressed="false">显示</button></div><small>长度为 8–128 位，请设置您自己的密码。</small></label>
          <label class="account-field"><span>确认新密码</span><input id="account-confirm" type="password" name="confirm_password" autocomplete="new-password" placeholder="再次输入新密码" minlength="8" maxlength="128" required /></label>
          <div id="account-error" class="account-error" role="alert" hidden></div>
          <div id="account-success" class="account-success" role="status" hidden></div>
          <button class="account-submit" id="account-submit" type="submit"><span id="password-submit-label">保存新密码并进入工作台</span><span aria-hidden="true">↗</span></button>
        </fieldset>
      </form>
      <p class="account-note" id="password-note">修改成功后将使用新密码登录。</p>
      <div class="account-status" id="account-status" role="status">正在连接企业知识库…</div>
    </div>
  </section>
</main>
</body>
</html>
